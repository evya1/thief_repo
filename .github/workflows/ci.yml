name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: latest-known
          enable-cache: true

      - name: Read configured Python version
        id: python
        run: >-
          echo "version=$(python3 -c 'import tomllib;
          print(tomllib.load(open("config/repo_quality.toml", "rb"))["python_version"])')"
          >> "$GITHUB_OUTPUT"

      - name: Install Python
        run: uv python install "${{ steps.python.outputs.version }}"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Tests and coverage
        run: uv run pytest

      - name: Repository quality gates
        run: uv run python scripts/run_quality_gates.py
