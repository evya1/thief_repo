# Local private LLM configuration for the CLI-vs-ref E2E (OpenRouter provider).
#
# The move is ALWAYS decided in Python. The OpenRouter model touches the verbal
# (hint) layer only. `template` is the default provider elsewhere; this file
# opts the harness into a live OpenRouter wording provider.
#
# Credential is NOT stored here: export OPENROUTER_API_KEY in the shell that
# launches the e2e (the CLI subprocess inherits the environment). The optional
# OPENROUTER_BASE_URL defaults to https://openrouter.ai/api/v1.
[llm]
provider = "openrouter"          # template | openrouter
model = "inclusionai/ling-3.0-flash"
provider_slug = "novita"
step_deadline_seconds = 30.0
max_output_tokens = 10
every_n_steps = 1
