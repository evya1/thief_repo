python_version = "3.12"

line_limit = 150
line_mode = "logical"
source_dirs = []
test_dirs = ["tests"]
script_dirs = ["scripts"]
code_extensions = [".py"]
exclude_dirs = [".git", ".venv", "__pycache__", ".pytest_cache", ".ruff_cache"]

required_docs = [
  "README.md",
  "AGENTS.md",
  "CONTRIBUTING.md",
  "config/README.md",
  "docs/PRD.md",
  "docs/PLAN.md",
  "docs/TODO.md",
  "docs/spec/CANONICAL_REQUIREMENTS.md",
  "docs/spec/OPEN_QUESTIONS.md",
  "docs/spec/PRD_PLAN_TODO_AGENT_WORKFLOW.md",
  "docs/spec/TRACEABILITY.md",
  "docs/inputs/INPUT_REGISTER.md",
  "docs/decisions/ADR-000-template.md",
  "docs/decisions/ADR-003-bounded-planning-model.md",
  "docs/changes/CR-000-template.md",
  "docs/components/README.md",
  "docs/interop/LEAGUE_COMPATIBILITY.md",
]
# Documentation-language gate (scripts/check_doc_language.py).
# Scope: current project-facing documentation. Tracked files only, so `.git/`,
# `.venv/`, and caches are never scanned. Official-source snapshots preserved
# verbatim are allowlisted; exact protocol literals are masked before matching.
doc_language_paths = [
  "README.md",
  "AGENTS.md",
  "CONTRIBUTING.md",
  "docs",
  "config/README.md",
  "scripts",
  "common",
]
doc_language_allowlist = [
  "docs/spec/CANONICAL_REQUIREMENTS.md",
  "scripts/check_doc_language.py",
  "scripts/check_source_archives.py",
]
doc_language_allowed_literals = [
  "reference-v3",
  "subtractive_chebyshev_v1",
  "multiplicative_book_v1",
  "commit_grid_v1",
]
doc_language_patterns = [
  "\\bpublic repositor\\w*",
  "\\bprivate repositor\\w*",
  "\\beither public\\b",
  "\\btwo public repositor\\w*",
  "\\bcopied\\b",
  "\\bcopy from\\b",
  "\\bvendored\\b",
  "\\bborrowed\\b",
  "\\bported\\b",
  "\\badapted from\\b",
  "\\bderived from\\b",
  "\\binspired by\\b",
  "\\breference implementation\\w*",
  "\\breference repositor\\w*",
  "\\bprior implementation\\w*",
  "\\breuse\\b",
  "\\bprovenance\\b",
  "\\bsource archive\\w*",
  "sources\\.zip",
  "\\brepo[12]\\b",
  "\\bplanning migration\\b",
  "bounded-context migration",
  "\\bgenerated from\\b",
  "did not copy",
  "nothing from",
  "not read for reuse",
  "\\bgreenfield\\b",
  "\\bkits?\\b",
  "\\bkit-first\\b",
  "\\bsparring\\b",
  "\\bcopthief\\w*",
  "\\bimre\\w*",
  "\\banrbj\\w*",
  "EVIDENCE_REGISTER",
  "\\bEVID-[0-9]",
  "PAIRING-PLAYBOOK",
]

markdown_paths = ["README.md", "AGENTS.md", "CONTRIBUTING.md", "config", "docs", ".github"]

todo_paths = ["docs/TODO.md"]
task_dirs = ["docs/tasks"]
task_id_pattern = "^T[0-9]{3,}$"

# Bounded-context migration (Issue #3): planning-graph validator configuration.
component_register = "docs/components/README.md"
component_ids = ["C01", "C02", "C03", "C04", "C05", "C06"]
component_dirs = ["docs/components"]
mechanism_dirs = ["docs/mechanisms"]
contract_dirs = ["docs/contracts"]
requirement_register = "docs/spec/CANONICAL_REQUIREMENTS.md"
open_register = "docs/spec/OPEN_QUESTIONS.md"
input_register = "docs/inputs/INPUT_REGISTER.md"
decision_register = "docs/spec/OPEN_QUESTIONS.md"
input_gate_ids = ["G-OFFICIAL", "G-PROFILE", "G-TEAM", "G-LIVE"]

archive_suffixes = [
  ".zip", ".tar", ".tar.gz", ".tgz", ".tar.bz2", ".tbz2",
  ".tar.xz", ".txz", ".gz", ".bz2", ".xz", ".7z", ".rar",
]
archive_allowlist = []

secret_allowed_paths = [".env.example"]
secret_banned_names = [
  ".env", "credentials.json", "token.json", "service-account.json",
]
secret_banned_globs = [".env.*", "*.pem", "*.key", "*.p12", "*.pfx", "id_rsa", "id_ed25519"]

workflow_dirs = [".github/workflows"]
workflow_allowed_write_permissions = []
